name: AccessiGramNative
options:
  bundleIdPrefix: org.accessigram
  deploymentTarget:
    iOS: "16.0"
packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    branch: main
  OpusCodec:
    url: https://github.com/sbooth/opus-binary-xcframework
    from: 0.3.0
  OggCodec:
    url: https://github.com/sbooth/ogg-binary-xcframework
    from: 0.1.3
targets:
  AccessiGramNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
      - Shared/ShareMailbox.swift
      - Resources/LaunchScreen.storyboard
    dependencies:
      - package: TDLibFramework
        product: TDLibFramework
      - package: OpusCodec
        product: opus
      - package: OggCodec
        product: ogg
      - target: AccessiGramShareExtension
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: org.accessigram.native
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/AppInfo.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "Accessi Gram"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "錄製語音訊息"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "選擇照片及影片傳送到 Telegram"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
  AccessiGramShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ShareExtension/ShareViewController.swift
      - Shared/ShareMailbox.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: org.accessigram.native.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
